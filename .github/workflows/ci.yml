name: Web CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Verify Bun version
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies (report only)
        continue-on-error: true
        run: bun audit --audit-level=high

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # SSR tests need .output, so they run after the build. SSR_TESTS=required turns the
      # "no build present" skip into a failure, so they cannot silently pass by not running.
      # Every SSR suite must be listed here: a suite left out would auto-skip in the pre-build
      # `bun run test` step and CI would stay green while the behaviour it guards regressed.
      - name: SSR tests
        env:
          SSR_TESTS: required
        run: bun test test/blog-ssr.test.ts test/private-routes-ssr.test.ts test/tax-notice-ssr.test.ts

      - name: Directory SSR tests
        env:
          SSR_TESTS: required
        run: bun test test/directory-ssr.test.ts

      - name: Verify portable server output
        run: |
          test ! -e .output/server/node_modules
          PORT=3010 node .output/server/index.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:3010/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
